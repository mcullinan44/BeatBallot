services:
  beatballot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      - postgres
    # No host port mapping — Caddy reaches this over the internal compose network.
    expose:
      - "8080"
    volumes:
      - beatballot-data:/app/data

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: beatballot
      POSTGRES_USER: beatballot
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    # Not exposed to the host — only reachable from other containers on this network.
    volumes:
      - postgres-data:/var/lib/postgresql/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - beatballot

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  beatballot-data:

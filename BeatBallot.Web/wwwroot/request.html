
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeatBallot - Request Songs</title>
    <style>
        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1A2042;
            color: white;
            min-height: 100vh;
        }

        /* Header Styles */
        .header {
            background: #1A2042;
            padding: 30px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

            .header::before {
                content: '';
                position: absolute;
                top: -50%;
                left: -50%;
                width: 200%;
                height: 200%;
                background: #1A2042;
                animation: pulse 4s ease-in-out infinite;
            }

        .logo {
            font-size: 2.5em;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            position: relative;
            z-index: 2;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0.8;
            }
        }

        @keyframes spin {
            from {
                transform: rotate3d(0, 0, 1, 0deg);
            }

            to {
                transform: rotate3d(0, 0, 1, 360deg);
            }
        }

        /* Main Content Styles */
        .vote-container {
            min-height: 100vh;
            background: #1A2042;
            color: white;
        }

        .request-page {
            background: #1A2042;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .section-title {
            background: #1A2042;
            flex-direction: column;
            color: white;
            font-size: 1.8em;
            margin-bottom: 30px;
            padding-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        .search-section {
            margin-bottom: 40px;
        }

        .search-container {
            position: relative;
            margin-bottom: 20px;
        }

        .search-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-icon {
            position: absolute;
            left: 20px;
            color: rgba(255,255,255,0.5);
            font-size: 1.2em;
            z-index: 1;
        }

        .search-input {
            width: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 20px 60px;
            color: white;
            font-size: 1.1em;
            transition: all 0.3s ease;
        }

            .search-input:focus {
                outline: none;
                border-color: #3498db;
                box-shadow: 0 0 20px rgba(52,152,219,0.3);
            }

            .search-input:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }

            .search-input::placeholder {
                color: rgba(255,255,255,0.5);
            }

        .clear-search-btn {
            position: absolute;
            right: 20px;
            background: none;
            border: none;
            color: rgba(255,255,255,0.5);
            font-size: 1.5em;
            cursor: pointer;
            padding: 5px;
            transition: color 0.3s ease;
            z-index: 1;
        }

            .clear-search-btn:hover {
                color: white;
            }

        .search-loading {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255,255,255,0.7);
            margin-top: 15px;
            padding-left: 20px;
        }

        .autocomplete-results {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            margin-top: 10px;
            max-height: 400px;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .search-result-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
            transition: all 0.3s ease;
        }

            .search-result-item:hover:not(.already-requested) {
                background: rgba(52,152,219,0.2);
            }

            .search-result-item:last-child {
                border-bottom: none;
            }

            .search-result-item.already-requested {
                opacity: 0.6;
                cursor: not-allowed;
                background: rgba(0,0,0,0.2);
            }

        .track-cover, .song-cover {
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .track-cover {
            width: 50px;
            height: 50px;
            margin-right: 15px;
        }

        .song-cover {
            width: 60px;
            height: 60px;
            margin-right: 20px;
            border-radius: 10px;
        }

        .cover-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cover-placeholder {
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #3498db, #2980b9);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2em;
        }

        .track-info, .song-info {
            flex: 1;
            min-width: 0;
        }

        .track-name, .song-name {
            color: white;
            font-weight: 500;
            margin: 0 0 5px 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .track-name {
            font-size: 1em;
        }

        .song-name {
            font-size: 1.1em;
            font-weight: 600;
        }

        .track-artist, .song-artist {
            color: rgba(255,255,255,0.8);
            margin: 0 0 3px 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .track-artist {
            font-size: 0.9em;
        }

        .song-artist {
            font-size: 0.95em;
        }

        .track-album, .song-album {
            color: rgba(255,255,255,0.6);
            margin: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .track-album {
            font-size: 0.8em;
        }

        .song-album {
            font-size: 0.85em;
            margin-bottom: 5px;
        }

        .request-time {
            color: rgba(255,255,255,0.5);
            font-size: 0.8em;
        }

        .track-actions, .song-actions {
            margin-left: 15px;
            flex-shrink: 0;
        }

        .request-btn {
            background: #FF6B9D;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.85em;
            font-weight: 600;
        }

            .request-btn:hover {
                transform: translateY(-1px);
                box-shadow: 0 5px 15px rgba(52,152,219,0.4);
            }

        .requested-badge {
            background: rgba(46,204,113,0.2);
            color: #2ecc71;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.75em;
            font-weight: 600;
            border: 1px solid rgba(46,204,113,0.3);
        }

        .remove-btn {
            background: rgba(231,76,60,0.2);
            border: 1px solid rgba(231,76,60,0.3);
            border-radius: 50%;
            width: 35px;
            height: 35px;
            color: #e74c3c;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
        }

            .remove-btn:hover {
                background: rgba(231,76,60,0.3);
                transform: scale(1.1);
            }

        .submit-requests-btn {
            background: #FF6B9D;
            border: none;
            border-radius: 15px;
            padding: 18px 40px;
            color: white;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 25px rgba(52,152,219,0.3);
        }

            .submit-requests-btn:hover:not(:disabled) {
                transform: translateY(-3px);
                box-shadow: 0 12px 35px rgba(52,152,219,0.4);
            }

            .submit-requests-btn:disabled {
                opacity: 0.7;
                cursor: not-allowed;
                transform: none;
            }

        .close-success-btn {
            background: #FF6B9D;
            border: none;
            border-radius: 12px;
            padding: 15px 30px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1em;
        }

            .close-success-btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 25px rgba(52,152,219,0.4);
            }

        .requested-section {
            margin-top: 40px;
        }

        .section-header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 0px;
        }

        .requested-songs-list {
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .requested-song-item {
            display: flex;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background 0.3s ease;
        }

            .requested-song-item:hover {
                background: rgba(255,255,255,0.02);
            }

            .requested-song-item:last-child {
                border-bottom: none;
            }

        .song-position {
            width: 30px;
            height: 30px;
            background: linear-gradient(45deg, #3498db, #2980b9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.9em;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .request-actions {
            text-align: center;
            padding: 20px 0;
        }

        .name-section {
            margin-bottom: 30px;
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .name-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .name-icon {
            position: absolute;
            left: 15px;
            color: rgba(255,255,255,0.5);
            font-size: 1.1em;
            z-index: 1;
        }

        .name-input {
            width: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px 50px;
            color: white;
            font-size: 1em;
            transition: all 0.3s ease;
        }

            .name-input:focus {
                outline: none;
                border-color: #3498db;
                box-shadow: 0 0 15px rgba(52,152,219,0.2);
            }

            .name-input::placeholder {
                color: rgba(255,255,255,0.4);
            }

        .clear-name-btn {
            position: absolute;
            right: 15px;
            background: none;
            border: none;
            color: rgba(255,255,255,0.5);
            font-size: 1.3em;
            cursor: pointer;
            padding: 5px;
            transition: color 0.3s ease;
            z-index: 1;
        }

            .clear-name-btn:hover {
                color: white;
            }

        .name-preview {
            color: rgba(255,255,255,0.7);
            font-size: 0.9em;
            text-align: center;
            padding: 5px 0;
        }

            .name-preview strong {
                color: #3498db;
                font-weight: 600;
            }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: rgba(255,255,255,0.7);
        }

        .empty-icon {
            font-size: 4em;
            margin-bottom: 20px;
            opacity: 0.7;
        }

        .empty-state h2 {
            color: white;
            font-size: 2em;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .empty-state p {
            font-size: 1.1em;
            max-width: 400px;
            margin: 0 auto;
            line-height: 1.5;
        }

        .success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .success-modal {
            background: #1A252F;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

            .success-modal h3 {
                color: white;
                font-size: 1.5em;
                margin-bottom: 15px;
                font-weight: bold;
            }

            .success-modal p {
                color: rgba(255,255,255,0.8);
                margin-bottom: 30px;
                line-height: 1.5;
            }

        .error-modal {
            border: 1px solid rgba(220,53,69,0.3);
        }

        .duplicate-info {
            color: rgba(255,255,255,0.6);
            font-size: 0.9em;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .loading-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        .btn-icon {
            font-size: 1.1em;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="vote-container">
        <!-- Header -->
        <div class="header">
            <div class="logo"><img src="../header-icon-small.png" alt="BeatBallot" style="max-height: 60px;" /></div>
        </div>

        <div class="request-page">
            <!-- Loading State -->
            <div id="loading-state">
                <p>Joining session...</p>
            </div>

            <!-- Main Content -->
            <div id="main-content" class="hidden">
                <div class="section-title">
                    <span>Request Songs</span>
                </div>

                <!-- Search Section -->
                <div class="search-section">
                    <div class="search-container">
                        <div class="search-input-wrapper">
                            <span class="search-icon">🔍</span>
                            <input type="text"
                                   id="search-input"
                                   class="search-input"
                                   placeholder="Search for songs, artists, or albums..."
                                   autocomplete="off" />
                            <button id="clear-search-btn" class="clear-search-btn hidden">×</button>
                        </div>

                        <div id="search-loading" class="search-loading hidden">
                            <span class="loading-spinner"></span>
                            <span>Searching BeatBallot...</span>
                        </div>
                    </div>

                    <!-- Auto-complete Results -->
                    <div id="autocomplete-results" class="autocomplete-results hidden"></div>
                </div>

                <!-- Requested Songs Section -->
                <div id="requested-section" class="requested-section hidden">
                    <!-- User Name Section -->
                    <div class="name-section">
                        <div class="name-input-wrapper">
                            <span class="name-icon">👤</span>
                            <input type="text"
                                   id="name-input"
                                   class="name-input"
                                   placeholder="Enter your name (optional)"
                                   maxlength="50"
                                   autocomplete="off" />
                            <button id="clear-name-btn" class="clear-name-btn hidden">×</button>
                        </div>
                        <div class="name-preview">
                            Requesting as: <strong id="name-preview">Anonymous</strong>
                        </div>
                    </div>

                    <div class="request-actions">
                        <button id="submit-requests-btn" class="submit-requests-btn" disabled>
                            <span id="submit-text">Submit 0 Requests</span>
                        </button>
                    </div>
                 

                    <div id="requested-songs-list" class="requested-songs-list"></div>


                </div>

                <!-- Empty State -->
                <div id="empty-state" class="empty-state">
                    <div class="empty-icon">🎵</div>
                    <h2>Start Requesting Songs</h2>
                    <p>Search for your favorite tracks and request songs for the DJ to consider.</p>
                </div>
            </div>

            <!-- Success Modal -->
            <div id="success-overlay" class="success-overlay hidden">
                <div class="success-modal">
                    <h3>Requests Submitted!</h3>
                    <p id="success-message">Your song requests have been sent to the DJ.</p>
                    <p id="duplicate-info" class="duplicate-info hidden"></p>
                    <button id="close-success-btn" class="close-success-btn">Continue</button>
                </div>
            </div>

            <!-- Error Modal -->
            <div id="error-overlay" class="success-overlay hidden">
                <div class="success-modal error-modal">
                    <p id="error-message">An error occurred</p>
                    <button id="close-error-btn" class="close-success-btn">Close</button>
                </div>
            </div>
        </div>
    </div>
  <script src="../voting.min.js"></script>
</body>
</html>

name: Deploy to Droplet

# Deliberately NOT triggered on every push to main — BeatBallot's live
# session state is in-memory (CLAUDE.md), so a deploy restarts the app and
# drops any in-progress DJ sessions. Deploys are tied to a GitHub Release
# (i.e. a version you chose to cut), plus a manual option for redeploying
# any ref on demand (hotfixes, re-running after an infra-only change, etc).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git tag or branch to deploy"
        required: false
        default: "main"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Resolve ref to deploy
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "ref=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.inputs.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ vars.DROPLET_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          DROPLET_HOST: ${{ vars.DROPLET_HOST }}
          DROPLET_SSH_KEY: /home/runner/.ssh/deploy_key
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          GIT_REF: ${{ steps.resolve.outputs.ref }}
        run: bash scripts/deploy-do.sh

      - name: Verify site is up
        run: |
          sleep 5
          curl -fsS --retry 5 --retry-delay 5 "https://${{ vars.DOMAIN }}" > /dev/null
          echo "Site responded OK."

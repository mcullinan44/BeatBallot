name: Build and deploy to Azure (container)
on:
  push:
    branches:
    - main
env:
  AZURE_WEBAPP_NAME: BeatBallotWeb20250601005053
  RESOURCE_GROUP: Dynamix-dev-rg
  ACR_NAME: beatballotreg
  IMAGE_NAME: beatballot
  DOTNET_CORE_VERSION: 8.0.x
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
    - name: Restore
      run: dotnet restore BeatBallot.sln
    - name: Build
      run: dotnet build BeatBallot.sln --configuration Release --no-restore
    - name: Test
      run: dotnet test BeatBallot.sln --configuration Release --no-build

  deploy:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
    - uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: ACR login
      run: az acr login --name "${{ env.ACR_NAME }}"

    - name: Build and push image
      run: |
        set -euo pipefail
        SHA_TAG="${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"
        LATEST_TAG="${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest"
        docker build -t "$SHA_TAG" -t "$LATEST_TAG" .
        docker push "$SHA_TAG"
        docker push "$LATEST_TAG"
        echo "IMAGE=$SHA_TAG" >> "$GITHUB_ENV"

    - name: Point App Service at the new image
      run: |
        az webapp config container set \
          --name "${{ env.AZURE_WEBAPP_NAME }}" \
          --resource-group "${{ env.RESOURCE_GROUP }}" \
          --container-image-name "${{ env.IMAGE }}" \
          --container-registry-url "https://${{ env.ACR_NAME }}.azurecr.io"

    - name: Install Doppler CLI
      uses: dopplerhq/cli-action@v3

    - name: Sync secrets from Doppler to App Service
      env:
        DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      run: |
        set -euo pipefail
        SETTINGS=()
        while IFS='=' read -r key value; do
          [ -z "$key" ] && continue
          echo "::add-mask::$value"
          SETTINGS+=("$key=$value")
        done < <(doppler secrets download --no-file --format env-no-quotes)

        az webapp config appsettings set \
          --name "${{ env.AZURE_WEBAPP_NAME }}" \
          --resource-group "${{ env.RESOURCE_GROUP }}" \
          --settings "${SETTINGS[@]}" \
          --output none

    - name: Restart App Service
      run: |
        az webapp restart \
          --name "${{ env.AZURE_WEBAPP_NAME }}" \
          --resource-group "${{ env.RESOURCE_GROUP }}"
